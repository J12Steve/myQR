<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Chuyển khoản nhanh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  tailwind.config = { darkMode: 'class' }
</script>
<style>
  :root{
    --navy: #0A1F44;
    --navy-2: #0F2A5C;
  }
  html,body{
    height:100%;
    font-family:'Be Vietnam Pro', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  .display{ font-family:'Manrope', sans-serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  body{
    background: radial-gradient(120% 60% at 15% -10%, #dbe6fb 0%, transparent 55%),
                radial-gradient(140% 70% at 100% 0%, #eef3fd 0%, transparent 50%),
                linear-gradient(180deg, #f4f7fd 0%, #eef1f8 100%);
    transition: background .5s ease;
    min-height:100vh;
  }
  html.dark body{
    background: radial-gradient(120% 60% at 15% -10%, #10203f 0%, transparent 55%),
                radial-gradient(140% 70% at 100% 0%, #0d1420 0%, transparent 50%),
                linear-gradient(180deg, #05070c 0%, #0a0d14 100%);
  }

  /* ambient blobs */
  .blob{ position:fixed; border-radius:9999px; filter: blur(60px); z-index:0; pointer-events:none; }

  .glass{
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.75);
    box-shadow: 0 8px 32px rgba(10,31,68,0.10), inset 0 1px 0 rgba(255,255,255,0.65);
  }
  html.dark .glass{
    background: rgba(20,26,40,0.55);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  .glass-strong{
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(30px) saturate(200%);
    -webkit-backdrop-filter: blur(30px) saturate(200%);
    border: 1px solid rgba(255,255,255,0.85);
    box-shadow: 0 20px 50px rgba(10,31,68,0.15), inset 0 1px 0 rgba(255,255,255,0.8);
  }
  html.dark .glass-strong{
    background: rgba(16,22,36,0.65);
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 20px 50px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .chip{
    background: rgba(255,255,255,0.45);
    border: 1px solid rgba(255,255,255,0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    transition: all .25s cubic-bezier(.4,0,.2,1);
  }
  html.dark .chip{
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .chip.active{
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    border-color: transparent;
    box-shadow: 0 6px 18px rgba(10,31,68,0.35);
  }

  .row-card{
    transition: transform .2s cubic-bezier(.4,0,.2,1), background .2s ease;
  }
  .row-card:active{ transform: scale(0.97); }
  .row-card.selected{
    box-shadow: 0 0 0 1.5px var(--navy) inset, 0 8px 32px rgba(10,31,68,0.10), inset 0 1px 0 rgba(255,255,255,0.65);
  }
  html.dark .row-card.selected{
    box-shadow: 0 0 0 1.5px #6f93e0 inset, 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  .toggle-btn{ transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
  .toggle-btn:active{ transform: scale(0.88) rotate(15deg); }

  .qr-wrap{
    background: #ffffff;
    border-radius: 22px;
    padding: 14px;
  }
  #qrcode-wallet canvas, #qrcode-wallet img{ display:block; margin:auto; border-radius: 8px; }

  .fade-in{ animation: fadeIn .35s ease both; }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform: translateY(0);} }

  .copied-toast{
    position: fixed; left:50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    opacity:0; pointer-events:none; transition: all .3s cubic-bezier(.4,0,.2,1); z-index:50;
  }
  .copied-toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar{ display:none; }
  * { scrollbar-width: none; }

  input[type=text]::placeholder{ color: inherit; opacity:.4; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body class="text-[#0A1F44] dark:text-[#EAF0FB]">

  <div class="blob w-72 h-72 -top-10 -left-16 bg-[#9DB8F0]/40 dark:bg-[#0A1F44]/60"></div>
  <div class="blob w-80 h-80 top-40 -right-24 bg-[#C9D8F7]/50 dark:bg-[#0F2A5C]/50"></div>

  <div class="relative z-10 max-w-md mx-auto min-h-screen px-5 pt-[max(env(safe-area-inset-top),24px)] pb-10 flex flex-col">

    <!-- Header -->
    <header class="flex items-center justify-between mb-6 fade-in">
      <div>
        <p class="text-[11px] tracking-[0.2em] uppercase opacity-50 font-semibold">Quét · Chuyển · Xong</p>
        <h1 class="display text-[26px] font-800 leading-tight mt-0.5">Chuyển khoản<br/>nhanh</h1>
      </div>
      <button id="themeToggle" class="toggle-btn w-11 h-11 rounded-full glass flex items-center justify-center shrink-0">
        <svg id="iconSun" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="iconMoon" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </header>

    <!-- Bank selector chips -->
    <div id="chipRow" class="flex gap-2 overflow-x-auto pb-1 mb-4 fade-in" style="scroll-snap-type:x proximity;"></div>

    <!-- Main QR card -->
    <section class="glass-strong rounded-[28px] p-6 mb-5 fade-in">
      <div class="flex items-center justify-between mb-4">
        <div>
          <p id="selName" class="display font-800 text-lg leading-none"></p>
          <p id="selSub" class="text-xs opacity-50 mt-1 font-medium"></p>
        </div>
        <span id="selBadge" class="text-[10px] font-bold tracking-wide uppercase px-2.5 py-1 rounded-full bg-[#0A1F44]/10 dark:bg-white/10"></span>
      </div>

      <div class="qr-wrap mx-auto w-full max-w-[240px] flex items-center justify-center min-h-[240px]">
        <img id="qrImage" class="w-full h-auto rounded-[10px] hidden" alt="Mã QR chuyển khoản"/>
        <div id="qrWallet" class="hidden"></div>
        <div id="qrLoading" class="text-xs opacity-40">Đang tạo mã QR…</div>
      </div>

      <div class="mt-5 flex items-center justify-between glass rounded-2xl px-4 py-3">
        <div class="min-w-0">
          <p class="text-[10px] opacity-50 uppercase tracking-wider font-semibold">Số tài khoản / SĐT</p>
          <p id="selAccount" class="mono text-[15px] font-medium mt-0.5 truncate"></p>
        </div>
        <button id="copyBtn" class="shrink-0 ml-3 w-10 h-10 rounded-xl bg-[#0A1F44] dark:bg-white flex items-center justify-center active:scale-90 transition-transform">
          <svg class="w-4 h-4 text-white dark:text-[#0A1F44]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
    </section>

    <!-- Amount / note -->
    <section class="glass rounded-3xl p-5 mb-5 fade-in">
      <p class="text-[11px] uppercase tracking-wider font-bold opacity-50 mb-3">Tuỳ chỉnh (không bắt buộc)</p>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[11px] opacity-50 font-medium">Số tiền (VNĐ)</label>
          <input id="amountInput" type="text" inputmode="numeric" placeholder="0" class="w-full bg-transparent border-b border-[#0A1F44]/15 dark:border-white/15 outline-none py-1.5 mono text-[15px] focus:border-[#0A1F44] dark:focus:border-white transition-colors">
        </div>
        <div>
          <label class="text-[11px] opacity-50 font-medium">Nội dung</label>
          <input id="noteInput" type="text" placeholder="Lời nhắn" maxlength="40" class="w-full bg-transparent border-b border-[#0A1F44]/15 dark:border-white/15 outline-none py-1.5 text-[15px] focus:border-[#0A1F44] dark:focus:border-white transition-colors">
        </div>
      </div>
      <p class="text-[10px] opacity-40 mt-2 leading-relaxed">Áp dụng cho tài khoản ngân hàng qua VietQR. Ví điện tử hiển thị mã theo số điện thoại.</p>
    </section>

    <!-- Full list -->
    <section class="fade-in">
      <p class="text-[11px] uppercase tracking-wider font-bold opacity-50 mb-3 px-1">Tất cả tài khoản</p>
      <div id="listWrap" class="flex flex-col gap-2.5"></div>
    </section>

    <footer class="text-center mt-8 mb-2 opacity-30 text-[11px] fade-in">
      Mã QR tạo bởi VietQR.io
    </footer>
  </div>

  <div id="toast" class="copied-toast">
    <div class="glass-strong px-5 py-3 rounded-2xl text-sm font-semibold flex items-center gap-2">
      <svg class="w-4 h-4 text-emerald-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="toastText">Đã sao chép</span>
    </div>
  </div>

<script>
  // ---------- data ----------
  const accounts = [
    { id:'vietinbank', name:'VietinBank', short:'VietinBank', code:'ICB', account:'108887662726', type:'bank' },
    { id:'mbbank',     name:'MB Bank',     short:'MB Bank',    code:'MB',  account:'094400357979', type:'bank' },
    { id:'techcombank',name:'Techcombank', short:'Techcombank',code:'TCB', account:'7912092004',   type:'bank' },
    { id:'tpbank',     name:'TPBank',      short:'TPBank',     code:'TPB', account:'00793992017',  type:'bank' },
    { id:'vietcombank',name:'Vietcombank', short:'Vietcombank',code:'VCB', account:'1031273792',   type:'bank' },
    { id:'momo',       name:'Momo',        short:'Ví Momo',    account:'0793992017', type:'wallet' },
    { id:'zalopay',    name:'ZaloPay',     short:'Ví ZaloPay', account:'0793992017', type:'wallet' },
  ];

  const initials = (n) => n.replace('Bank','').trim().split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

  let current = accounts[0];

  // ---------- theme ----------
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const iconSun = document.getElementById('iconSun');
  const iconMoon = document.getElementById('iconMoon');

  function applyTheme(dark){
    root.classList.toggle('dark', dark);
    iconSun.classList.toggle('hidden', dark);
    iconMoon.classList.toggle('hidden', !dark);
  }
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark);
  themeToggle.addEventListener('click', () => applyTheme(!root.classList.contains('dark')));

  // ---------- chips ----------
  const chipRow = document.getElementById('chipRow');
  accounts.forEach(a => {
    const chip = document.createElement('button');
    chip.className = 'chip shrink-0 px-4 py-2.5 rounded-2xl text-sm font-semibold whitespace-nowrap';
    chip.style.scrollSnapAlign = 'start';
    chip.textContent = a.short;
    chip.dataset.id = a.id;
    chip.addEventListener('click', () => select(a.id));
    chipRow.appendChild(chip);
  });

  // ---------- list rows ----------
  const listWrap = document.getElementById('listWrap');
  accounts.forEach(a => {
    const row = document.createElement('button');
    row.className = 'row-card glass rounded-2xl px-4 py-3 flex items-center justify-between text-left';
    row.dataset.id = a.id;
    row.innerHTML = `
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-[#0A1F44] dark:bg-white/10 flex items-center justify-center shrink-0">
          <span class="text-[11px] font-800 text-white dark:text-[#EAF0FB]">${initials(a.name)}</span>
        </div>
        <div class="min-w-0">
          <p class="font-semibold text-sm truncate">${a.name}</p>
          <p class="mono text-xs opacity-50 truncate">${a.account}</p>
        </div>
      </div>
      <svg class="w-4 h-4 opacity-30 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    `;
    row.addEventListener('click', () => select(a.id));
    listWrap.appendChild(row);
  });

  // ---------- QR ----------
  const qrImage = document.getElementById('qrImage');
  const qrWallet = document.getElementById('qrWallet');
  const qrLoading = document.getElementById('qrLoading');
  const amountInput = document.getElementById('amountInput');
  const noteInput = document.getElementById('noteInput');

  function buildVietQrUrl(a){
    const amount = amountInput.value.replace(/[^\d]/g,'');
    const note = encodeURIComponent(noteInput.value.trim());
    let url = `https://img.vietqr.io/image/${a.code}-${a.account}-qr_only.png?`;
    const params = [];
    if (amount) params.push(`amount=${amount}`);
    if (note) params.push(`addInfo=${note}`);
    url += params.join('&');
    return url;
  }

  function renderQR(a){
    qrImage.classList.add('hidden');
    qrWallet.classList.add('hidden');
    qrWallet.innerHTML = '';
    qrLoading.classList.remove('hidden');

    if (a.type === 'bank'){
      const url = buildVietQrUrl(a);
      const img = new Image();
      img.onload = () => {
        qrImage.src = url;
        qrImage.classList.remove('hidden');
        qrLoading.classList.add('hidden');
      };
      img.onerror = () => { qrLoading.textContent = 'Không thể tải mã QR'; };
      img.src = url;
    } else {
      qrLoading.classList.add('hidden');
      qrWallet.classList.remove('hidden');
      new QRCode(qrWallet, {
        text: a.account,
        width: 200,
        height: 200,
        colorDark: '#0A1F44',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    }
  }

  // ---------- select ----------
  const selName = document.getElementById('selName');
  const selSub = document.getElementById('selSub');
  const selBadge = document.getElementById('selBadge');
  const selAccount = document.getElementById('selAccount');

  function select(id){
    current = accounts.find(x => x.id === id);
    document.querySelectorAll('#chipRow .chip').forEach(c => c.classList.toggle('active', c.dataset.id === id));
    document.querySelectorAll('#listWrap .row-card').forEach(r => r.classList.toggle('selected', r.dataset.id === id));

    selName.textContent = current.name;
    selAccount.textContent = current.account;
    if (current.type === 'bank'){
      selSub.textContent = 'Chuyển khoản ngân hàng';
      selBadge.textContent = 'Ngân hàng';
    } else {
      selSub.textContent = 'Ví điện tử';
      selBadge.textContent = 'Ví';
    }
    renderQR(current);

    document.querySelector(`#chipRow .chip[data-id="${id}"]`)?.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
  }

  let debounce;
  [amountInput, noteInput].forEach(inp => {
    inp.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => { if (current.type === 'bank') renderQR(current); }, 450);
    });
  });

  // ---------- copy ----------
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toastText');
  document.getElementById('copyBtn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(current.account);
      toastText.textContent = `Đã sao chép • ${current.name}`;
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = current.account;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toastText.textContent = `Đã sao chép • ${current.name}`;
    }
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  });

  // init
  select(accounts[0].id);
</script>
</body>
</html>
